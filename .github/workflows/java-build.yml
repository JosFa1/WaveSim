name: Java build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install shader compiler
        run: sudo apt-get update && sudo apt-get install -y glslc

      - name: Build
        run: gradle build
