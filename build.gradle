plugins {
    id 'application'
}

group = 'wavesim'
version = '0.1.0'

repositories {
    mavenCentral()
}

def lwjglVersion = '3.3.3'
def osName = System.getProperty('os.name').toLowerCase(Locale.ROOT)
def lwjglNatives
if (osName.contains('windows')) {
    lwjglNatives = 'natives-windows'
} else if (osName.contains('mac')) {
    lwjglNatives = 'natives-macos'
} else if (osName.contains('linux')) {
    lwjglNatives = 'natives-linux'
} else {
    throw new GradleException("Unsupported operating system: ${System.getProperty('os.name')}")
}

dependencies {
    implementation "org.lwjgl:lwjgl:${lwjglVersion}"
    implementation "org.lwjgl:lwjgl-glfw:${lwjglVersion}"
    implementation "org.lwjgl:lwjgl-vulkan:${lwjglVersion}"

    runtimeOnly "org.lwjgl:lwjgl:${lwjglVersion}:${lwjglNatives}"
    runtimeOnly "org.lwjgl:lwjgl-glfw:${lwjglVersion}:${lwjglNatives}"
}

application {
    mainClass = 'wavesim.WaveSim'
    applicationDefaultJvmArgs = [
            '-Dorg.lwjgl.system.stackSize=1048576',
            '--enable-native-access=ALL-UNNAMED'
    ]
}

def generatedShaders = layout.buildDirectory.dir('generated/resources/shaders')

tasks.register('compileShaders') {
    inputs.files(fileTree('shaders') {
        include 'text.vert'
        include 'text.frag'
    })
    outputs.dir(generatedShaders)

    doLast {
        def outputDirectory = generatedShaders.get().asFile
        outputDirectory.mkdirs()
        def vulkanSdk = System.getenv('VULKAN_SDK')
        def sdkCompiler = vulkanSdk == null ? null : new File(
                vulkanSdk,
                osName.contains('windows') ? 'Bin/glslc.exe' : 'bin/glslc'
        )
        def glslc = System.getenv('GLSLC') ?: (sdkCompiler?.isFile() ? sdkCompiler.absolutePath : 'glslc')

        fileTree('shaders').matching {
            include 'text.vert'
            include 'text.frag'
        }.files.each { source ->
            def process = new ProcessBuilder(
                    glslc,
                    source.absolutePath,
                    '-o',
                    new File(outputDirectory, source.name + '.spv').absolutePath
            ).inheritIO().start()
            if (process.waitFor() != 0) {
                throw new GradleException("Shader compilation failed for ${source.name}")
            }
        }
    }
}

tasks.named('processResources') {
    dependsOn tasks.named('compileShaders')
    from(generatedShaders) {
        into 'shaders'
    }
}
